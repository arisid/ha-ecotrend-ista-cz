# Měsíční grafy spotřeby (voda + energie) pro Lovelace dashboard
#
# Vyžaduje:
#  - kartu "ApexCharts Card" (custom:apexcharts-card) z HACS -> Frontend,
#  - integraci ista EcoTrend CZ v0.8.0 nebo novější (atribut monthly_consumption).
#
# PŘED VLOŽENÍM NAHRAĎ TYHLE TŘI ŘÁDKY svými skutečnými entity ID:
#   sensor.YOUR_COLD_WATER_ENTITY_ID
#   sensor.YOUR_HOT_WATER_ENTITY_ID
#   sensor.YOUR_ENERGY_ENTITY_ID
#
# Entity ID této integrace obsahují v názvu adresu z ista účtu (např.
# sensor.ista_ecotrend_hlavni_12_..._studena_voda_toaleta), takže se liší
# instalaci od instalace a nejdou tu předvyplnit.
# Najdeš je v Nastavení -> Zařízení a služby -> ista EcoTrend -> zařízení ->
# senzor -> ozubené kolo -> "ID entity", nebo ve Vývojářské nástroje -> Stavy
# (filtr "ista").
#
# Jak to funguje:
# - Každý sloupec je hodnota za jeden kalendářní měsíc přímo z historie ista
#   (atribut `monthly_consumption`, např. {"2026-10": 1.02}) - tedy přesně to,
#   co ukazuje aplikace ista. Nic se nepočítá z rozdílů uložených stavů
#   senzoru, takže se spotřeba nemůže přesouvat mezi sousedními měsíci.
# - Poslední sloupec je aktuální měsíc. Dokud ista nemá pro nový měsíc
#   žádnou hodnotu (typicky první dny v měsíci), ukáže se 0.
# - Atribut se obnovuje při každém dotazu integrace na ista (výchozí
#   interval: 1 den) - data v ista se stejně mění jen asi jednou týdně.

type: vertical-stack
cards:
  - type: custom:apexcharts-card
    header:
      show: true
      title: Spotřeba vody – měsíčně
      show_states: true
      colorize_states: true
    apex_config:
      plotOptions:
        bar:
          columnWidth: 90%
      legend:
        show: false
    graph_span: 13month
    span:
      end: month
    update_interval: 1h
    yaxis:
      - decimals: 2
        min: 0
    series:
      - entity: sensor.YOUR_COLD_WATER_ENTITY_ID
        name: Studená voda
        color: '#3399ff'
        type: column
        unit: m³
        float_precision: 2
        data_generator: |
          const attr = entity.attributes.monthly_consumption || {};
          const now = new Date();
          const out = [];
          for (let i = 12; i >= 0; i--) {
            const month = new Date(now.getFullYear(), now.getMonth() - i, 1);
            const key = month.getFullYear() + '-' + String(month.getMonth() + 1).padStart(2, '0');
            const raw = attr[key];
            const value = (raw === null || raw === undefined) ? NaN : Number(raw);
            if (isFinite(value)) {
              out.push([month.getTime(), Math.round(Math.max(0, value) * 1000) / 1000]);
            } else if (i === 0) {
              out.push([month.getTime(), 0]);
            }
          }
          return out;
      - entity: sensor.YOUR_HOT_WATER_ENTITY_ID
        name: Teplá voda
        color: '#ff9900'
        type: column
        unit: m³
        float_precision: 2
        data_generator: |
          const attr = entity.attributes.monthly_consumption || {};
          const now = new Date();
          const out = [];
          for (let i = 12; i >= 0; i--) {
            const month = new Date(now.getFullYear(), now.getMonth() - i, 1);
            const key = month.getFullYear() + '-' + String(month.getMonth() + 1).padStart(2, '0');
            const raw = attr[key];
            const value = (raw === null || raw === undefined) ? NaN : Number(raw);
            if (isFinite(value)) {
              out.push([month.getTime(), Math.round(Math.max(0, value) * 1000) / 1000]);
            } else if (i === 0) {
              out.push([month.getTime(), 0]);
            }
          }
          return out;
  - type: custom:apexcharts-card
    header:
      show: true
      title: Spotřeba energie – měsíčně
      show_states: true
      colorize_states: true
    apex_config:
      plotOptions:
        bar:
          columnWidth: 90%
      legend:
        show: false
    graph_span: 13month
    span:
      end: month
    update_interval: 1h
    yaxis:
      - decimals: 0
        min: 0
    series:
      - entity: sensor.YOUR_ENERGY_ENTITY_ID
        name: Energie
        color: '#2ecc71'
        type: column
        unit: kWh
        float_precision: 1
        data_generator: |
          const attr = entity.attributes.monthly_consumption || {};
          const now = new Date();
          const out = [];
          for (let i = 12; i >= 0; i--) {
            const month = new Date(now.getFullYear(), now.getMonth() - i, 1);
            const key = month.getFullYear() + '-' + String(month.getMonth() + 1).padStart(2, '0');
            const raw = attr[key];
            const value = (raw === null || raw === undefined) ? NaN : Number(raw);
            if (isFinite(value)) {
              out.push([month.getTime(), Math.round(Math.max(0, value) * 1000) / 1000]);
            } else if (i === 0) {
              out.push([month.getTime(), 0]);
            }
          }
          return out;
