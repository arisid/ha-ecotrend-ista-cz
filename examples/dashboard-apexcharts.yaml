# Měsíční grafy spotřeby (voda + energie) pro Lovelace dashboard
#
# Vyžaduje kartu "ApexCharts Card" (custom:apexcharts-card) nainstalovanou
# přes HACS -> Frontend.
#
# PŘED VLOŽENÍM NAHRAĎ TYHLE TŘI ŘÁDKY svými skutečnými entity ID:
#   sensor.YOUR_COLD_WATER_ENTITY_ID
#   sensor.YOUR_HOT_WATER_ENTITY_ID
#   sensor.YOUR_ENERGY_ENTITY_ID
#
# Entity ID této integrace obsahují v názvu adresu z tvého ista účtu (např.
# sensor.ista_ecotrend_hlavni_12_..._studena_voda_toaleta), takže se liší
# instalaci od instalace - nejsou tedy univerzální a v tomhle souboru je
# nejde předvyplnit natvrdo za tebe.
# Najdeš je v Nastavení -> Zařízení a služby -> ista EcoTrend -> klikni na
# zařízení -> u každého senzoru v pravém horním rohu (i) -> "entity ID",
# nebo přes Vývojářské nástroje -> Stavy, filtr "ista".
#
# Vysvětlivky k nastavení:
# - `statistics: {type: change, period: month}` počítá rozdíl (spotřebu)
#   za každý kalendářní měsíc přímo z dlouhodobých statistik - žádný další
#   `group_by` navrch není potřeba, protože historie importovaná touhle
#   integrací je uložená přesně po měsících.
# - `span: {end: month, offset: "-1month"}` schválně vynechává aktuální
#   nedokončený měsíc - karta ho pro neúplné období spolehlivě nepočítá
#   (vychází záporná/nesmyslná čísla), nezávisle na téhle integraci.
#   Aktuální rozjetý měsíc proto řeší samostatný kód, který počítá rozdíl aktuální hodnoty od poslední hodnoty v předchozím měsíci.

type: vertical-stack
cards:
  - type: custom:apexcharts-card
    header:
      show: true
      title: Spotřeba vody – měsíčně
      show_states: true
      colorize_states: true
    apex_config:
      plotOptions:
        bar:
          columnWidth: 90%
      legend:
        show: false
    graph_span: 13month
    span:
      end: month
    stacked: true
    yaxis:
      - decimals: 2
        min: 0
    series:
      - entity: >-
          sensor.YOUR_COLD_WATER_ENTITY_ID
        name: Studená voda
        color: '#3399ff'
        type: column
        unit: m³
        float_precision: 2
        statistics:
          type: change
          period: month
          align: start
        transform: >
          if (x === null) return null;

          var s = new Date(entity.start), n = new Date();

          if (s.getFullYear() === n.getFullYear() && s.getMonth() ===
          n.getMonth()) return null;

          return Math.max(0, x);
        show:
          in_header: false
      - entity: >-
          sensor.YOUR_COLD_WATER_ENTITY_ID
        name: Studená voda
        color: '#3399ff'
        type: column
        unit: m³
        float_precision: 2
        show:
          in_header: true
        data_generator: |
          var d = new Date();
          var v = Number(entity.attributes.consumption_this_month);
          return [[new Date(d.getFullYear(), d.getMonth(), 1).getTime(),
                   isNaN(v) ? null : Math.max(0, v)]];
      - entity: >-
          sensor.YOUR_HOT_WATER_ENTITY_ID
        name: Teplá voda
        color: '#ff9900'
        type: column
        unit: m³
        float_precision: 2
        statistics:
          type: change
          period: month
          align: start
        transform: >
          if (x === null) return null;

          var s = new Date(entity.start), n = new Date();

          if (s.getFullYear() === n.getFullYear() && s.getMonth() ===
          n.getMonth()) return null;

          return Math.max(0, x);
        show:
          in_header: false
      - entity: >-
          sensor.YOUR_HOT_WATER_ENTITY_ID
        name: Teplá voda
        color: '#ff9900'
        type: column
        unit: m³
        float_precision: 2
        show:
          in_header: true
        data_generator: |
          var d = new Date();
          var v = Number(entity.attributes.consumption_this_month);
          return [[new Date(d.getFullYear(), d.getMonth(), 1).getTime(),
                   isNaN(v) ? null : Math.max(0, v)]];
  - type: custom:apexcharts-card
    header:
      show: true
      title: Spotřeba energie – měsíčně
      show_states: true
      colorize_states: true
    apex_config:
      plotOptions:
        bar:
          columnWidth: 90%
      legend:
        show: false
    graph_span: 13month
    span:
      end: month
    yaxis:
      - decimals: 0
        min: 0
    series:
      - entity: >-
          sensor.YOUR_ENERGY_ENTITY_ID
        name: Energie
        color: '#2ecc71'
        type: column
        unit: kWh
        float_precision: 1
        statistics:
          type: change
          period: month
          align: start
        transform: >
          if (x === null) return null;

          var s = new Date(entity.start), n = new Date();

          if (s.getFullYear() === n.getFullYear() && s.getMonth() ===
          n.getMonth()) return null;

          return Math.max(0, x);
        show:
          in_header: false
      - entity: >-
          sensor.YOUR_ENERGY_ENTITY_ID
        name: Energie
        color: '#2ecc71'
        type: column
        unit: kWh
        float_precision: 1
        show:
          in_header: true
        data_generator: |
          var d = new Date();
          var v = Number(entity.attributes.consumption_this_month);
          return [[new Date(d.getFullYear(), d.getMonth(), 1).getTime(),
                   isNaN(v) ? null : Math.max(0, v)]];
