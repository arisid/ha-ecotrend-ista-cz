# Měsíční grafy spotřeby (voda + energie) pro Lovelace dashboard
#
# Vyžaduje kartu "ApexCharts Card" (custom:apexcharts-card) nainstalovanou
# přes HACS -> Frontend.
#
# PŘED VLOŽENÍM NAHRAĎ TYHLE TŘI ŘÁDKY svými skutečnými entity ID:
#   sensor.YOUR_COLD_WATER_ENTITY_ID
#   sensor.YOUR_HOT_WATER_ENTITY_ID
#   sensor.YOUR_ENERGY_ENTITY_ID
#
# Entity ID této integrace obsahují v názvu adresu z tvého ista účtu (např.
# sensor.ista_ecotrend_hlavni_12_..._studena_voda_toaleta), takže se liší
# instalaci od instalace - nejsou tedy univerzální a v tomhle souboru je
# nejde předvyplnit natvrdo za tebe.
# Najdeš je v Nastavení -> Zařízení a služby -> ista EcoTrend -> klikni na
# zařízení -> u každého senzoru v pravém horním rohu (i) -> "entity ID",
# nebo přes Vývojářské nástroje -> Stavy, filtr "ista".
#
# Vysvětlivky k nastavení:
# - `statistics: {type: change, period: month}` počítá rozdíl (spotřebu)
#   za každý kalendářní měsíc přímo z dlouhodobých statistik - žádný další
#   `group_by` navrch není potřeba, protože historie importovaná touhle
#   integrací je uložená přesně po měsících.
# - `span: {end: month, offset: "-1month"}` schválně vynechává aktuální
#   nedokončený měsíc - karta ho pro neúplné období spolehlivě nepočítá
#   (vychází záporná/nesmyslná čísla), nezávisle na téhle integraci.
#   Aktuální rozjetý měsíc proto řeší samostatný kód, který počítá rozdíl aktuální hodnoty od poslední hodnoty v předchozím měsíci.

type: vertical-stack
cards:
  - type: custom:apexcharts-card
    header:
      show: true
      title: Spotřeba vody – měsíčně
      show_states: true
      colorize_states: true
    apex_config:
      plotOptions:
        bar:
          columnWidth: 90%
      legend:
        show: false
    graph_span: 13month
    span:
      end: month
    update_interval: 1h
    yaxis:
      - decimals: 2
        min: 0
    series:
      - entity: >-
          sensor.kuchyne_ista_ecotrend_kovanecka_9_903501_190_00_praha_9_studena_voda_toaleta
        name: Studená voda
        color: '#3399ff'
        type: column
        unit: m³
        float_precision: 2
        data_generator: >
          const id = entity.entity_id;

          const now = new Date();

          const idx = (d) => d.getFullYear() * 12 + d.getMonth();

          const cur = idx(now);

          const res = await hass.callWS({
            type: 'recorder/statistics_during_period',
            start_time: new Date(now.getFullYear(), now.getMonth() - 15, 1).toISOString(),
            statistic_ids: [id],
            period: 'month',
            types: ['state'],
          });

          const reading = {};

          (res[id] || []).forEach((r) => {
            if (r.state === null || r.state === undefined) return;
            const t = typeof r.start === 'number' ? r.start : new Date(r.start).getTime();
            reading[idx(new Date(t))] = Number(r.state);
          });

          const live = Number(entity.state);

          if (isFinite(live)) reading[cur] = live;

          const out = [];

          Object.keys(reading).map(Number).sort((a, b) => a - b).forEach((k) =>
          {
            if (k < cur - 12 || reading[k - 1] === undefined) return;
            let v = reading[k] - reading[k - 1];
            if (k === cur) {
              const a = entity.attributes.consumption_this_month;
              if (a !== null && a !== undefined && isFinite(Number(a))) v = Number(a);
            }
            out.push([new Date(Math.floor(k / 12), k % 12, 1).getTime(), Math.round(Math.max(0, v) * 1000) / 1000]);
          });

          return out;
      - entity: >-
          sensor.kuchyne_ista_ecotrend_kovanecka_9_903501_190_00_praha_9_tepla_voda_toaleta
        name: Teplá voda
        color: '#ff9900'
        type: column
        unit: m³
        float_precision: 2
        data_generator: >
          const id = entity.entity_id;

          const now = new Date();

          const idx = (d) => d.getFullYear() * 12 + d.getMonth();

          const cur = idx(now);

          const res = await hass.callWS({
            type: 'recorder/statistics_during_period',
            start_time: new Date(now.getFullYear(), now.getMonth() - 15, 1).toISOString(),
            statistic_ids: [id],
            period: 'month',
            types: ['state'],
          });

          const reading = {};

          (res[id] || []).forEach((r) => {
            if (r.state === null || r.state === undefined) return;
            const t = typeof r.start === 'number' ? r.start : new Date(r.start).getTime();
            reading[idx(new Date(t))] = Number(r.state);
          });

          const live = Number(entity.state);

          if (isFinite(live)) reading[cur] = live;

          const out = [];

          Object.keys(reading).map(Number).sort((a, b) => a - b).forEach((k) =>
          {
            if (k < cur - 12 || reading[k - 1] === undefined) return;
            let v = reading[k] - reading[k - 1];
            if (k === cur) {
              const a = entity.attributes.consumption_this_month;
              if (a !== null && a !== undefined && isFinite(Number(a))) v = Number(a);
            }
            out.push([new Date(Math.floor(k / 12), k % 12, 1).getTime(), Math.round(Math.max(0, v) * 1000) / 1000]);
          });

          return out;
